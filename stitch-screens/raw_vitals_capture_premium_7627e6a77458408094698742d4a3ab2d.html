<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vitals Capture Dashboard - OmniCare AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#00E5FF",
                        "midnight": "#050B10",
                        "deep-blue": "#0A192F",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .liquid-glow {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .liquid-glow:hover {
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-midnight text-slate-100 font-sans min-h-screen relative overflow-x-hidden selection:bg-primary/30">
<!-- Background decorative gradients -->
<div class="fixed inset-0 z-0 pointer-events-none" data-alt="Soft deep-blue mesh gradients">
<div class="absolute top-[-20%] left-[-10%] w-[70%] h-[70%] bg-blue-900/20 rounded-full blur-[160px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[80%] h-[80%] bg-primary/10 rounded-full blur-[180px]"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[50%] h-[50%] bg-deep-blue/30 rounded-full blur-[140px]"></div>
</div>
<div class="relative z-10 flex h-auto min-h-screen w-full flex-col group/design-root">
<div class="layout-container flex h-full grow flex-col">
<div class="px-6 sm:px-8 md:px-16 lg:px-40 flex flex-1 justify-center py-12 md:py-20">
<div class="layout-content-container flex flex-col w-full max-w-[1100px] flex-1">
<!-- Header -->
<div class="flex flex-col gap-2 mb-12 px-4">
<h1 class="text-white tracking-tight text-4xl md:text-5xl font-bold leading-tight">Vitals Capture</h1>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<p class="text-primary/70 text-sm md:text-base font-medium tracking-widest uppercase">OmniCare AI • HealthHub Premium</p>
</div>
</div>
<!-- Vitals Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 p-4">
<!-- Temperature -->
<div class="group flex flex-col gap-6 rounded-2xl border border-primary/20 bg-white/[0.03] backdrop-blur-[20px] p-8 transition-all duration-500 hover:bg-white/[0.05] hover:border-primary/40">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/80 group-hover:text-primary transition-colors duration-300">device_thermostat</span>
<h2 class="text-slate-300 text-sm font-medium tracking-wider uppercase">Temperature</h2>
</div>
</div>
<div class="flex items-baseline justify-center gap-2">
<input class="form-input w-full bg-transparent border-none p-0 text-5xl font-light text-center focus:ring-0 placeholder:text-slate-700" placeholder="--.-" type="text" value=""/>
<span class="text-slate-500 text-lg font-medium">°C</span>
</div>
</div>
<!-- Blood Pressure -->
<div class="group flex flex-col gap-6 rounded-2xl border border-primary/20 bg-white/[0.03] backdrop-blur-[20px] p-8 transition-all duration-500 hover:bg-white/[0.05] hover:border-primary/40">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/80 group-hover:text-primary transition-colors duration-300">monitor_heart</span>
<h2 class="text-slate-300 text-sm font-medium tracking-wider uppercase">Blood Pressure</h2>
</div>
</div>
<div class="flex items-baseline justify-center gap-2">
<input class="form-input w-full bg-transparent border-none p-0 text-5xl font-light text-center focus:ring-0 placeholder:text-slate-700 tracking-tighter" placeholder="120/80" type="text" value=""/>
<span class="text-slate-500 text-lg font-medium">mmHg</span>
</div>
</div>
<!-- Pulse -->
<div class="group flex flex-col gap-6 rounded-2xl border border-primary/20 bg-white/[0.03] backdrop-blur-[20px] p-8 transition-all duration-500 hover:bg-white/[0.05] hover:border-primary/40">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/80 group-hover:text-primary transition-colors duration-300">ecg</span>
<h2 class="text-slate-300 text-sm font-medium tracking-wider uppercase">Pulse</h2>
</div>
</div>
<div class="flex items-baseline justify-center gap-2">
<input class="form-input w-full bg-transparent border-none p-0 text-5xl font-light text-center focus:ring-0 placeholder:text-slate-700" placeholder="--" type="text" value=""/>
<span class="text-slate-500 text-lg font-medium">bpm</span>
</div>
</div>
<!-- SpO2 -->
<div class="group flex flex-col gap-6 rounded-2xl border border-primary/20 bg-white/[0.03] backdrop-blur-[20px] p-8 transition-all duration-500 hover:bg-white/[0.05] hover:border-primary/40">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/80 group-hover:text-primary transition-colors duration-300">air</span>
<h2 class="text-slate-300 text-sm font-medium tracking-wider uppercase">SpO2</h2>
</div>
</div>
<div class="flex items-baseline justify-center gap-2">
<input class="form-input w-full bg-transparent border-none p-0 text-5xl font-light text-center focus:ring-0 placeholder:text-slate-700" placeholder="--" type="text" value=""/>
<span class="text-slate-500 text-lg font-medium">%</span>
</div>
</div>
<!-- Weight -->
<div class="group flex flex-col gap-6 rounded-2xl border border-primary/20 bg-white/[0.03] backdrop-blur-[20px] p-8 transition-all duration-500 hover:bg-white/[0.05] hover:border-primary/40">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/80 group-hover:text-primary transition-colors duration-300">monitor_weight</span>
<h2 class="text-slate-300 text-sm font-medium tracking-wider uppercase">Weight</h2>
</div>
</div>
<div class="flex items-baseline justify-center gap-2">
<input class="form-input w-full bg-transparent border-none p-0 text-5xl font-light text-center focus:ring-0 placeholder:text-slate-700" placeholder="--.-" type="text" value=""/>
<span class="text-slate-500 text-lg font-medium">kg</span>
</div>
</div>
<!-- Respiratory Rate -->
<div class="group flex flex-col gap-6 rounded-2xl border border-primary/20 bg-white/[0.03] backdrop-blur-[20px] p-8 transition-all duration-500 hover:bg-white/[0.05] hover:border-primary/40">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary/80 group-hover:text-primary transition-colors duration-300">pulmonology</span>
<h2 class="text-slate-300 text-sm font-medium tracking-wider uppercase">Respiration</h2>
</div>
</div>
<div class="flex items-baseline justify-center gap-2">
<input class="form-input w-full bg-transparent border-none p-0 text-5xl font-light text-center focus:ring-0 placeholder:text-slate-700" placeholder="--" type="text" value=""/>
<span class="text-slate-500 text-lg font-medium">bpm</span>
</div>
</div>
</div>
<!-- Action Area -->
<div class="flex justify-center mt-16 p-4">
<button class="liquid-glow w-full max-w-md h-16 rounded-full bg-primary text-midnight font-bold text-lg tracking-widest uppercase transition-all duration-500 flex items-center justify-center gap-3 active:scale-95">
<span class="material-symbols-outlined font-bold">save</span>
                            Save Records
                        </button>
</div>
</div>
</div>
</div>
</div>
</body></html>
